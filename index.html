<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COMPRO ORO — Il Simulatore</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font-family:system-ui,Arial}
header{padding:18px 24px;background:#1d1d1d;border-bottom:1px solid #444;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}
h1{margin:0;font-size:24px}.stats{display:flex;gap:18px;font-weight:700}
main{max-width:1100px;margin:auto;padding:24px;display:grid;grid-template-columns:1.1fr .9fr;gap:20px}
.card{background:#1d1d1d;border:1px solid #3d3d3d;border-radius:14px;padding:20px;box-shadow:0 8px 30px #0005}
.customer{font-size:20px;font-weight:700}.muted{color:#aaa}.item{font-size:42px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #333}
input{width:100%;padding:12px;border-radius:9px;border:1px solid #555;background:#111;color:#fff;font-size:18px}
button{padding:12px 16px;border:0;border-radius:9px;background:#d5a83a;color:#111;font-weight:800;cursor:pointer;margin-top:10px}
button:hover{filter:brightness(1.1)}button.secondary{background:#555;color:#fff}.msg{min-height:50px;margin-top:14px;padding:12px;border-radius:9px;background:#111}
.log{max-height:220px;overflow:auto;font-size:14px}.good{color:#8be28b}.bad{color:#ff8585}
@media(max-width:800px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>🪙 COMPRO ORO — Il Simulatore</h1>
  <div class="stats"><span>💶 Cassa: €<b id="cash"></b></span><span>📦 Oro: <b id="stock"></b> g</span><span>⭐ Reputazione: <b id="rep"></b></span></div>
</header>
<main>
<section class="card">
  <div class="customer" id="customer"></div>
  <div class="muted" id="desc"></div>
  <div class="item" id="item"></div>
  <div class="grid">
    <div class="row"><span>Peso</span><b id="weight"></b></div>
    <div class="row"><span>Caratura</span><b id="karat"></b></div>
    <div class="row"><span>Purezza</span><b id="purity"></b></div>
    <div class="row"><span>Valore teorico</span><b>€<span id="value"></span></b></div>
  </div>
  <p class="muted">Quotazione oro 24K: €<span id="quote"></span>/g</p>
  <label>La tua offerta (€)</label>
  <input id="offer" type="number" min="0" step="1" placeholder="Inserisci offerta">
  <button onclick="buy()">Fai l'offerta</button>
  <button class="secondary" onclick="newCustomer()">Rifiuta / prossimo cliente</button>
  <div class="msg" id="msg"></div>
</section>
<section class="card">
  <h2>🏪 Negozio</h2>
  <div class="row"><span>Clienti serviti</span><b id="served">0</b></div>
  <div class="row"><span>Profitto realizzato</span><b>€<span id="profit">0</span></b></div>
  <div class="row"><span>Livello</span><b id="level">1</b></div>
  <h3>Azioni</h3>
  <button onclick="sellStock()">Vendi 10g al grossista</button>
  <button onclick="upgrade()">Migliora il negozio (€500)</button>
  <h3>📋 Diario</h3>
  <div class="log" id="log"></div>
</section>
</main>
<script>
const items=[
 ["Anello","💍",3.8,[9,14,18,24]],
 ["Collana","📿",12.5,[14,18,24]],
 ["Bracciale","📿",8.2,[9,14,18]],
 ["Orecchini","✨",2.6,[14,18,24]],
 ["Moneta","🪙",7.8,[18,22,24]],
 ["Ciondolo","🔶",5.1,[9,14,18]]
];
const names=["Marco","Giulia","Luca","Sara","Antonio","Elena","Davide","Francesca"];
let s={cash:5000,stock:0,rep:50,served:0,profit:0,level:1,quote:92,customer:null};
const el=id=>document.getElementById(id);
function money(n){return Math.round(n).toLocaleString("it-IT")}
function log(t,cls=""){el("log").innerHTML=`<div class="${cls}">${t}</div>`+el("log").innerHTML}
function newCustomer(){
 let it=items[Math.floor(Math.random()*items.length)], k=it[3][Math.floor(Math.random()*it[3].length)];
 let w=+(it[2]*(.75+Math.random()*.55)).toFixed(1);
 let purity=k/24, value=w*purity*s.quote;
 s.customer={name:names[Math.floor(Math.random()*names.length)],item:it,k,w,purity,value};
 render();
}
function render(){
 el("cash").textContent=money(s.cash);el("stock").textContent=s.stock.toFixed(1);
 el("rep").textContent=s.rep;el("served").textContent=s.served;el("profit").textContent=money(s.profit);
 el("level").textContent=s.level;el("quote").textContent=s.quote;
 if(!s.customer)return;
 let c=s.customer;
 el("customer").textContent=c.name+" è entrato nel negozio";
 el("desc").textContent="Vuole vendere questo oggetto. Valutalo e prova a ottenere un margine.";
 el("item").textContent=c.item[1]+" "+c.item[0];
 el("weight").textContent=c.w+" g";el("karat").textContent=c.k+"K";
 el("purity").textContent=(c.purity*100).toFixed(1)+"%";
 el("value").textContent=money(c.value);
 el("offer").value="";
}
function buy(){
 let c=s.customer, o=+el("offer").value;
 if(!o||o<=0)return;
 let fair=c.value;
 if(o>s.cash){el("msg").textContent="Non hai abbastanza liquidità.";return}
 if(o>fair*1.08){s.rep-=2;el("msg").textContent="Offerta troppo alta: il cliente accetta, ma hai quasi azzerato il margine.";log("Acquisto costoso: -2 reputazione","bad")}
 else if(o<fair*.55){s.rep-=4;el("msg").textContent="Il cliente si sente preso in giro e se ne va.";log("Cliente perso per offerta troppo bassa","bad");s.customer=null;render();newCustomer();return}
 else if(o<fair*.70){s.rep-=1;el("msg").textContent="Il cliente esita, poi accetta.";log("Buon affare, ma il cliente non è entusiasta","good")}
 else {s.rep+=1;el("msg").textContent="Affare concluso!";log("Acquistato "+c.item[0]+" per €"+money(o),"good")}
 s.cash-=o;s.stock+=c.w*c.purity;s.served++;s.customer=null;render();setTimeout(newCustomer,500);
}
function sellStock(){
 if(s.stock<10){el("msg").textContent="Ti servono almeno 10g di oro.";return}
 let sale=10*s.quote*.97;s.stock-=10;s.cash+=sale;s.profit+=sale;
 log("Venduti 10g al grossista per €"+money(sale),"good");render();
}
function upgrade(){
 if(s.cash<500){el("msg").textContent="Servono €500.";return}
 s.cash-=500;s.level++;s.quote+=Math.floor(Math.random()*3)+1;
 log("Negozio migliorato: livello "+s.level,"good");render();
}
newCustomer();render();
</script>
</body></html>
