<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Compro Oro - Simulatore</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:linear-gradient(135deg,#080d18,#17233a);
 color:#fff;
 font-family:Arial,sans-serif;
}

button,input,select{
 font:inherit;
}

#start{
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:20px;
}

.start-box{
 width:min(520px,100%);
 text-align:center;
 background:#111a2a;
 border:1px solid #35445d;
 border-radius:25px;
 padding:45px 25px;
 box-shadow:0 20px 70px #0008;
}

.coin{
 font-size:70px;
}

.start-box h1{
 font-size:44px;
 margin:10px 0;
}

.start-box h2{
 color:#f6c453;
}

.start-button{
 border:0;
 border-radius:13px;
 padding:16px 30px;
 background:linear-gradient(135deg,#ffe08a,#d89413);
 color:#3b2800;
 font-weight:bold;
 cursor:pointer;
 margin-top:20px;
}

.hidden{
 display:none!important;
}

.app{
 max-width:1150px;
 margin:auto;
 padding:15px;
}

header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 flex-wrap:wrap;
 margin-bottom:12px;
}

.logo{
 width:50px;
 height:50px;
 border-radius:15px;
 background:#f6c453;
 color:#4b3200;
 display:grid;
 place-items:center;
 font-weight:bold;
 font-size:20px;
}

.brand{
 display:flex;
 gap:10px;
 align-items:center;
}

.brand h1{
 margin:0;
 font-size:20px;
}

.sub{
 color:#9ca3af;
 font-size:13px;
}

.stats{
 display:flex;
 gap:7px;
 flex-wrap:wrap;
}

.pill{
 background:#101827;
 border:1px solid #34435b;
 padding:8px 11px;
 border-radius:20px;
}

.gold{
 color:#f6c453;
}

.green{
 color:#40d98a;
}

.redtext{
 color:#fb7185;
}

.layout{
 display:grid;
 grid-template-columns:205px 1fr;
 gap:13px;
}

nav{
 background:#0e1726;
 border:1px solid #2b3850;
 border-radius:17px;
 padding:8px;
 height:max-content;
}

nav button{
 width:100%;
 padding:11px;
 margin:2px 0;
 border:0;
 border-radius:10px;
 background:transparent;
 color:#cbd5e1;
 text-align:left;
 cursor:pointer;
}

nav button:hover,
nav button.active{
 background:#24324a;
 color:#fff;
}

.page{
 display:none;
}

.page.active{
 display:block;
}

.panel,
.card{
 background:#111a2a;
 border:1px solid #2b3850;
 border-radius:17px;
 padding:15px;
}

.grid{
 display:grid;
 gap:10px;
}

.g2{
 grid-template-columns:1fr 1fr;
}

.g3{
 grid-template-columns:repeat(3,1fr);
}

.big{
 font-size:27px;
 font-weight:bold;
 margin:5px 0;
}

.customer{
 display:flex;
 align-items:center;
 gap:12px;
}

.avatar{
 width:75px;
 height:75px;
 border-radius:50%;
 border:2px solid #ffffff22;
}

.customer-name{
 font-size:20px;
 font-weight:bold;
}

.mood{
 font-size:35px;
 margin-left:auto;
}

.actions{
 display:flex;
 gap:7px;
 flex-wrap:wrap;
 margin-top:12px;
}

.btn{
 padding:10px 13px;
 border-radius:10px;
 border:1px solid #40516e;
 background:#24324a;
 color:#fff;
 cursor:pointer;
}

.btn:hover{
 filter:brightness(1.15);
}

.goldbtn{
 background:linear-gradient(135deg,#f6c453,#d89413);
 color:#3b2800;
 font-weight:bold;
}

.redbtn{
 background:#7f1d2d;
}

.btn:disabled{
 opacity:.4;
 cursor:not-allowed;
}

input,
select{
 width:100%;
 padding:10px;
 border-radius:9px;
 border:1px solid #334155;
 background:#09111e;
 color:#fff;
}

table{
 width:100%;
 border-collapse:collapse;
}

th,
td{
 padding:9px;
 border-bottom:1px solid #2b3850;
 text-align:left;
}

.notice{
 display:none;
 background:#2c2109;
 border:1px solid #80651c;
 padding:12px;
 border-radius:12px;
 margin-bottom:12px;
}

.notice.show{
 display:block;
}

.list{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

.client-row{
 display:flex;
 align-items:center;
 gap:10px;
 background:#0d1625;
 padding:9px;
 border-radius:11px;
}

.client-row img{
 width:48px;
 height:48px;
 border-radius:50%;
}

.log{
 background:#0b1422;
 padding:9px;
 border-radius:9px;
 margin:7px 0;
 font-size:13px;
 color:#cbd5e1;
}

.bar{
 height:9px;
 background:#09111e;
 border-radius:10px;
 overflow:hidden;
 margin-top:8px;
}

.bar span{
 display:block;
 height:100%;
 background:#f6c453;
 width:0;
 transition:width .25s;
}

.shake{
 animation:shake .4s;
}

.pop{
 animation:pop .4s;
}

@keyframes shake{
